<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ver na minha mesa</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <link rel="stylesheet" href="/static/camera.css?v=13">
</head>

<body>
  <!-- Câmera traseira ao fundo -->
  <video id="cam" playsinline muted autoplay></video>

  <!-- Produto 3D por cima da câmera -->
  <model-viewer
    id="product"
    alt="Modelo 3D aproximado do produto. Arraste para ver por outros ângulos."
    camera-controls
    touch-action="none"
    interaction-prompt="none"
    shadow-intensity="1.2"
    shadow-softness="1"
    exposure="1.1"
    environment-image="neutral"
    camera-orbit="0deg 78deg 120%"
    min-camera-orbit="-Infinity 20deg 25%"
    max-camera-orbit="Infinity 95deg 450%"
    loading="eager"
    reveal="auto">
  </model-viewer>

  <!-- Modo foto: a imagem do produto por cima da câmera -->
  <div class="photo-layer" id="photo-layer" hidden>
    <div class="photo" id="photo">
      <img id="photo-img" alt="" draggable="false">
    </div>
  </div>

  <div class="top">
    <a class="back" href="/">‹ Cardápio</a>
  </div>

  <div class="bottom">
    <div class="status" id="cam-status">Arraste para girar · Pinça para ajustar o tamanho · Dois dedos para mover</div>

    <div class="card">
      <div class="card-info">
        <strong id="cam-name"></strong>
        <span id="cam-price"></span>
      </div>
      <div class="card-actions">
        <button type="button" id="btn-spin" aria-label="Girar a imagem 15 graus">Girar imagem ↻</button>
        <button type="button" id="btn-reset" aria-label="Centralizar e restaurar a foto">Centralizar</button>
      </div>
    </div>
  </div>

  <script src="/static/products.js?v=18"></script>
  <script src="/static/camera.js?v=15"></script>
</body>
</html>
